<svg xmlns="http://www.w3.org/2000/svg" width="176" height="54" viewBox="0 0 176 54" role="img" aria-label="Scholar"><title>Scholar</title><desc>Scholar link button</desc><defs></defs><style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Roboto,Arial,'Liberation Sans',FreeSans,sans-serif}
.m{font-family:'Cascadia Mono','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.t1{animation:tw 3.1s ease-in-out infinite}
.t2{animation:tw 4.3s ease-in-out -1.2s infinite}
.t3{animation:tw 5.2s ease-in-out -2.6s infinite}
.t4{animation:tw 2.7s ease-in-out -.8s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
