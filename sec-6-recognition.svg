<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="6 of 8: Recognition"><title>6 of 8: Recognition</title><desc>Hackathons, awards and certificates</desc><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070c25"/><stop offset="1" stop-color="#0a1129"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#cfe0ff" stop-opacity=".9"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient><radialGradient id="glowA"><stop offset="0" stop-color="#ffb454" stop-opacity=".95"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient><radialGradient id="glowT"><stop offset="0" stop-color="#5eead4" stop-opacity=".9"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient><radialGradient id="neb1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6552ee" stop-opacity=".42"/><stop offset="1" stop-color="#6552ee" stop-opacity="0"/></radialGradient><radialGradient id="neb2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#13a3a0" stop-opacity=".26"/><stop offset="1" stop-color="#13a3a0" stop-opacity="0"/></radialGradient></defs><style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Roboto,Arial,'Liberation Sans',FreeSans,sans-serif}
.m{font-family:'Cascadia Mono','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.t1{animation:tw 3.1s ease-in-out infinite}
.t2{animation:tw 4.3s ease-in-out -1.2s infinite}
.t3{animation:tw 5.2s ease-in-out -2.6s infinite}
.t4{animation:tw 2.7s ease-in-out -.8s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.bl{animation:blink 1.05s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3,.t4{animation:none}}
