@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.t1{animation:tw 3.1s ease-in-out infinite}
.t2{animation:tw 4.3s ease-in-out -1.2s infinite}
.t3{animation:tw 5.2s ease-in-out -2.6s infinite}
.t4{animation:tw 2.7s ease-in-out -.8s infinite}
