.bl{animation:blink 1.05s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3,.t4{animation:none}}

@keyframes roll{0%,100%{fill:#1a2547}7%{fill:#ffb454}34%{fill:#1a2547}}
.led{fill:#1a2547;animation:roll 2.2s linear infinite}
@media (prefers-reduced-motion:reduce){.led{animation:none}}
