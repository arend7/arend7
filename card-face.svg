<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Live face detection"><title>Live face detection</title><desc>Real-time face detection and counting</desc><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070c25"/><stop offset="1" stop-color="#0a1129"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#cfe0ff" stop-opacity=".9"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient><radialGradient id="glowA"><stop offset="0" stop-color="#ffb454" stop-opacity=".95"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient><radialGradient id="glowT"><stop offset="0" stop-color="#5eead4" stop-opacity=".9"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient><radialGradient id="neb1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6552ee" stop-opacity=".42"/><stop offset="1" stop-color="#6552ee" stop-opacity="0"/></radialGradient><radialGradient id="neb2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#13a3a0" stop-opacity=".26"/><stop offset="1" stop-color="#13a3a0" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="440" height="300" rx="16"/></clipPath><clipPath id="webclip"><rect x="61" y="37" width="318" height="84"/></clipPath><linearGradient id="ill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1334"/><stop offset="1" stop-color="#0e1836"/></linearGradient><linearGradient id="cnnband" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset="1" stop-color="#5eead4" stop-opacity=".35"/></linearGradient></defs><style>
